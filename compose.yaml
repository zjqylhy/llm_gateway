name: llm-gateway-offline
services:
  dev:
    build: .
    command: ["/app/dev"]
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:8081:8081"]
    environment:
      GW_ADMIN_PASSWORD: ${GW_ADMIN_PASSWORD:-}
      GOMEMLIMIT: 384MiB
      GW_MAX_CONCURRENT_REQUESTS: "8"
      GW_MAX_ADMIN_REQUESTS: "4"
    mem_limit: 512m
    cpus: 2
    pids_limit: 256
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    stop_grace_period: 130s

# 显式叠加启用私有 Grafana；随机密码保存在权限受限的 .grafana.env。
services:
  admin:
    environment:
      GW_GRAFANA_URL: http://grafana:3000
  grafana:
    image: ${GW_GRAFANA_IMAGE:-grafana/grafana:13.2.3}
    env_file: ${GW_GRAFANA_ENV_FILE:-../../.grafana.env}
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SERVER_ROOT_URL: ${GW_GRAFANA_ROOT_URL:-https://localhost:9443/admin/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_LIVE_MAX_CONNECTIONS: "0"
      GF_SERVER_ENABLE_GZIP: "true"
      GOMEMLIMIT: 384MiB
      GOMAXPROCS: "1"
    ports: ["127.0.0.1:3000:3000"]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    volumes:
      - grafana:/var/lib/grafana
      - ../observability/grafana:/etc/grafana/provisioning:ro
      - ../observability/dashboard.json:/var/lib/grafana/dashboards/gateway.json:ro
      - ../observability/application-dashboard.json:/var/lib/grafana/dashboards/applications.json:ro
volumes:
  grafana: {}

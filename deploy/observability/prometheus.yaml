global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: gateway
    static_configs: [{targets: [gateway:8080]}]
  - job_name: admin
    static_configs: [{targets: [admin:8081]}]
  - job_name: worker
    static_configs: [{targets: [worker:8082]}]

name: llm-gateway-integration
x-app: &app
  build:
    context: ../..
  image: llm-gateway:local
  env_file: ../../.env
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  stop_grace_period: 130s
  restart: unless-stopped
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gateway
      MYSQL_USER: gateway
      MYSQL_PASSWORD: ${GW_LOCAL_DB_PASSWORD:?set local DB password}
      MYSQL_ROOT_PASSWORD: ${GW_LOCAL_ROOT_PASSWORD:?set local root password}
    volumes: ["mysql:/var/lib/mysql"]
    healthcheck:
      test: [CMD-SHELL, "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      retries: 30
  redis:
    image: redis:7.4
    environment:
      REDIS_PASSWORD: ${GW_LOCAL_REDIS_PASSWORD:?set local Redis password}
    command: [sh, -c, 'exec redis-server --appendonly yes --appendfsync always --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
    volumes: ["redis:/data"]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping']
      interval: 5s
      retries: 30
  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes: ["kafka:/var/lib/kafka/data"]
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null"]
      interval: 10s
      retries: 30
  kafka-init:
    image: apache/kafka:4.0.0
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: [/opt/kafka/bin/kafka-topics.sh]
    command: [--bootstrap-server, kafka:9092, --create, --if-not-exists, --topic, gateway-events, --partitions, "6", --replication-factor, "1", --config, retention.ms=604800000]
    restart: "no"
  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    command: [etcd, --advertise-client-urls=http://etcd:2379, --listen-client-urls=http://0.0.0.0:2379, --data-dir=/etcd]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
    volumes: ["etcd:/etcd"]
    healthcheck:
      test: [CMD, etcdctl, endpoint, health]
      interval: 5s
      retries: 30
  minio:
    # 与 Milvus 官方部署配置保持一致，原 minio/minio 镜像已无法拉取。
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    command: [minio, server, /data]
    environment:
      MINIO_ACCESS_KEY: gateway
      MINIO_SECRET_KEY: ${GW_LOCAL_OBJECT_PASSWORD:?set object store password}
    volumes: ["minio:/data"]
  milvus:
    image: milvusdb/milvus:v2.6.0
    command: [milvus, run, standalone]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: gateway
      MINIO_SECRET_ACCESS_KEY: ${GW_LOCAL_OBJECT_PASSWORD:?set object store password}
    depends_on:
      etcd: {condition: service_healthy}
      minio: {condition: service_started}
    volumes: ["milvus:/var/lib/milvus"]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      interval: 10s
      retries: 30
  gateway:
    <<: *app
    command: [/app/gateway]
    ports: ["127.0.0.1:8080:8080"]
  admin:
    <<: *app
    command: [/app/admin]
  worker:
    <<: *app
    command: [/app/worker]
  migrate:
    <<: *app
    command: [/app/migrate]
    restart: "no"
    profiles: [setup]
  bootstrap:
    <<: *app
    command: [/app/bootstrap]
    restart: "no"
    profiles: [setup]
  cache-init:
    <<: *app
    command: [/app/cache-init]
    restart: "no"
    profiles: [setup]
  edge:
    image: caddy:2.10
    ports: ["127.0.0.1:8443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy:/data"]
    depends_on: [admin]
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: ["../observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro", "../observability/alerts.yaml:/etc/prometheus/alerts.yml:ro", "prometheus:/prometheus"]
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GW_GRAFANA_PASSWORD:?set Grafana password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:3000:3000"]
    volumes: ["../observability/grafana:/etc/grafana/provisioning:ro", "../observability/dashboard.json:/var/lib/grafana/dashboards/gateway.json:ro", "grafana:/var/lib/grafana"]
volumes:
  mysql: {}
  redis: {}
  kafka: {}
  etcd: {}
  minio: {}
  milvus: {}
  caddy: {}
  prometheus: {}
  grafana: {}

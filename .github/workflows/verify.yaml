name: Verify
on:
  push:
  pull_request:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: test -z "$(gofmt -l internal cmd)"
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - run: npm ci && npm run build && npx prettier --check src
        working-directory: web
      - run: node scripts/validate-deploy.mjs
      - run: docker compose config --quiet
      - run: docker build -t llm-gateway:verify .

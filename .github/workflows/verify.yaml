name: Verify
on:
  push:
  pull_request:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: test -z "$(gofmt -l internal cmd)"
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - run: npm ci && npm run build && npm test && npx prettier --check src tests
        working-directory: web
      - run: node scripts/validate-deploy.mjs
      - run: docker run --rm --network none --memory 128m --read-only --tmpfs /tmp:rw,size=64m,mode=1777 --cap-drop ALL -v "$PWD/deploy/observability:/rules:ro" --entrypoint /bin/promtool prom/prometheus:v3.5.0 test rules /rules/alerts.test.yaml
      - run: docker compose config --quiet
      - run: docker build -t llm-gateway:verify .
